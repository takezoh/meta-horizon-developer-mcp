[project]
name = "meta-horizon-developer-mcp"
version = "0.1.0"
description = "Meta Horizon の開発者ダッシュボード Analytics を読み取り専用で収集する MCP サーバ (+ owner 用 CLI)"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27,<2",
    "playwright>=1.61,<2",
]

[project.scripts]
meta-horizon-developer = "meta_horizon_developer.cli:main"
meta-horizon-developer-mcp = "meta_horizon_developer.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_horizon_developer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
